<template id="beats-template">
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      src: url("assets/fonts/Inter-Variable.woff2") format("woff2");
    }
    @font-face {
      font-family: "Geist Mono";
      font-style: normal;
      font-weight: 100 900;
      src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2");
    }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: #1d1519;
      font-family: "Inter", sans-serif;
    }
    #beats-bg {
      position: absolute;
      inset: 0;
      background: #f3eee7;
    }
    #beats-dark {
      position: absolute;
      inset: 0;
      background: #1d1519;
      opacity: 0;
    }
    /* Day counter: a port of Watermelon UI's flip-clock (split-flap digits) */
    #beats-clock {
      position: absolute;
      left: 0;
      right: 0;
      top: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #beats-clock-label {
      margin-right: 14px;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6a5e64;
    }
    /* xl unit is 88×128 / 96px mono 500, #FAFAFA on #171717, 6px visible corners; here at 1.18× */
    .beats-flip {
      position: relative;
      width: 104px;
      height: 151px;
    }
    .beats-stack {
      position: absolute;
      inset: 0;
      border-radius: 7px;
      overflow: hidden;
      background: #171717;
      perspective: 1000px;
      box-shadow: 0 0 0 1.5px rgba(243, 238, 231, 0.14);
      opacity: 0;
    }
    .beats-half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      background: #171717;
      color: #fafafa;
      backface-visibility: hidden;
    }
    .beats-half.top {
      top: 0;
      border-radius: 9px 9px 0 0;
      transform-origin: 50% 100%;
    }
    .beats-half.bottom {
      top: 50%;
      border-radius: 0 0 9px 9px;
      transform-origin: 50% 0%;
    }
    .beats-half span {
      position: absolute;
      left: 0;
      right: 0;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Geist Mono", monospace;
      font-size: 113px;
      font-weight: 500;
    }
    .beats-half.top span {
      top: 0;
    }
    .beats-half.bottom span {
      top: -100%;
    }
    .beats-half.flap.top {
      z-index: 2;
    }
    .beats-half.flap.bottom {
      z-index: 1;
    }
    .beats-divider {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1.2px;
      margin-top: -0.6px;
      background: rgba(255, 255, 255, 0.5);
      z-index: 3;
    }
    /* Punchlines (product-film kit): every word holds its slot from the start, so a
       centred line never re-centres; each lands with a 16px blur and a 36px rise. */
    .beats-card {
      position: absolute;
      inset: 0;
      padding-top: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.26em;
      font-family: "Instrument Serif", serif;
      font-size: 180px; /* Instrument Serif runs small: optically the skill's 160px */
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .beats-w {
      display: inline-flex;
      align-items: center;
      opacity: 0;
    }
    .beats-w.accent {
      font-style: italic;
      color: #6d2e62;
    }
    #beats-c5 {
      color: #f3eee7;
    }
    .beats-mark {
      display: inline-flex;
      width: 0.82em;
      height: 0.82em;
    }
    .beats-mark svg {
      width: 100%;
      height: 100%;
    }
  </style>

  <div
    id="root"
    data-composition-id="beats"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <div id="beats-bg" class="clip" data-start="0" data-duration="6" data-track-index="0" data-layout-allow-occlusion>
      <div id="beats-dark"></div>
    </div>

    <div id="beats-scene" class="clip" data-start="0" data-duration="6" data-track-index="1">
      <div id="beats-clock">
        <div id="beats-clock-label">Day</div>
        <div class="beats-flip"></div>
        <div class="beats-flip"></div>
        <div class="beats-flip"></div>
      </div>

      <!-- Punchline cards: data-at / data-out are cue names from cues.js (":offset" in seconds) -->
      <div class="beats-card" id="beats-c1" data-out="match:-0.1">
        <span class="beats-mark" id="beats-like-mark"><svg viewBox="0 0 24 24" fill="#6d2e62" stroke="#6d2e62" stroke-width="1.5" stroke-linejoin="round"><path d="M10.4107 19.9677C7.58942 17.858 2 13.0348 2 8.69444C2 5.82563 4.10526 3.5 7 3.5C8.5 3.5 10 4 12 6C14 4 15.5 3.5 17 3.5C19.8947 3.5 22 5.82563 22 8.69444C22 13.0348 16.4106 17.858 13.5893 19.9677C12.6399 20.6776 11.3601 20.6776 10.4107 19.9677Z" /></svg></span>
        <span class="beats-w" data-at="like">Like.</span>
      </div>
      <div class="beats-card" id="beats-c2" data-out="first:-0.1">
        <span class="beats-w" data-at="match">Match.</span>
      </div>
      <div class="beats-card" id="beats-c3" data-out="second:-0.1">
        <span class="beats-w" data-at="first">First</span><span class="beats-w" data-at="first:0.5">date.</span>
      </div>
      <div class="beats-card" id="beats-c4" data-out="friends:-0.1">
        <span class="beats-w accent" data-at="second">Second</span><span class="beats-w" data-at="second:0.25">date.</span>
      </div>
      <div class="beats-card" id="beats-c5" data-out="us:-0.1">
        <span class="beats-w" data-at="friends">Meet</span><span class="beats-w" data-at="friends:0.25">the</span><span class="beats-w" data-at="friends:0.5">friends.</span>
      </div>
      <div class="beats-card" id="beats-c6">
        <span class="beats-w accent" data-at="us">Us.</span>
        <span class="beats-w beats-mark" data-at="usHeart"><svg viewBox="0 0 24 24" fill="#6d2e62" stroke="#6d2e62" stroke-width="1.5" stroke-linejoin="round"><path d="M10.4107 19.9677C7.58942 17.858 2 13.0348 2 8.69444C2 5.82563 4.10526 3.5 7 3.5C8.5 3.5 10 4 12 6C14 4 15.5 3.5 17 3.5C19.8947 3.5 22 5.82563 22 8.69444C22 13.0348 16.4106 17.858 13.5893 19.9677C12.6399 20.6776 11.3601 20.6776 10.4107 19.9677Z" /></svg></span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const C = window.CUES.beats;
      const T0 = window.CUES.scenes.beats.start;
      const at = (name, offset = 0) => C[name] - T0 + offset;
      const cue = (spec) => {
        const [name, offset] = spec.split(":");
        return at(name, Number(offset || 0));
      };

      // Punchlines: each word lands in 0.3s on cubic-bezier(.22,1,.36,1) (≈ power4.out);
      // a card leaves with a quick blur just before the next one's first word.
      document.querySelectorAll(".beats-card").forEach((card) => {
        card.querySelectorAll(".beats-w").forEach((w) => {
          tl.fromTo(
            w,
            { opacity: 0, y: 36, filter: "blur(16px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" },
            cue(w.dataset.at),
          );
        });
        if (card.dataset.out) {
          tl.fromTo(
            card,
            { opacity: 1, y: 0, filter: "blur(0px)" },
            { opacity: 0, y: -16, filter: "blur(12px)", duration: 0.18, ease: "none", immediateRender: false },
            cue(card.dataset.out),
          );
        }
      });
      // The heart that travelled in from the last scene takes its slot beside "Like."
      tl.fromTo("#beats-like-mark", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at("likeMark"));

      // Flip-clock day counter. One static stack per transition (prev → next),
      // so every frame is a pure function of time: the top flap falls away
      // showing the old digit, then the bottom flap swings down with the new one.
      // Time keeps passing on the off-beats (tick1, tick2), so no beat sits idle.
      const DAYS = ["000", "001", "002", "005", "009", "016", "030", "058", "214"];
      const FLIPS = ["like", "match", "tick1", "first", "second", "tick2", "friends", "us"].map((n) => at(n));
      const FLIP = 0.3; // per half, as in the original component
      const half = (pos, flap, digit) =>
        `<div class="beats-half ${pos}${flap ? " flap" : ""}"><span data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>${digit}</span></div>`;
      document.querySelectorAll(".beats-flip").forEach((unit, col) => {
        for (let k = 1; k < DAYS.length; k++) {
          const prev = DAYS[k - 1][col], next = DAYS[k][col];
          const stack = document.createElement("div");
          stack.className = "beats-stack";
          stack.innerHTML =
            half("top", false, next) + half("bottom", false, prev) +
            half("bottom", true, next) + half("top", true, prev) +
            '<div class="beats-divider"></div>';
          unit.appendChild(stack);
          const t = FLIPS[k - 1];
          tl.set(stack, { opacity: 1 }, t);
          if (k < DAYS.length - 1) tl.set(stack, { opacity: 0 }, FLIPS[k]);
          const flapTop = stack.querySelector(".flap.top");
          const flapBottom = stack.querySelector(".flap.bottom");
          if (prev === next) {
            tl.set(flapBottom, { rotationX: 0 }, 0);
            continue;
          }
          // CSS ease-in (.42,0,1,1) then ease-out (0,0,.58,1): power1 is the near match.
          tl.fromTo(flapTop, { rotationX: 0 }, { rotationX: -90, duration: FLIP, ease: "power1.in" }, t);
          tl.fromTo(flapBottom, { rotationX: 90 }, { rotationX: 0, duration: FLIP, ease: "power1.out" }, t + FLIP);
        }
      });

      // Lights out for "Meet the friends."; back on for "Us."
      tl.set("#beats-dark", { opacity: 1 }, at("friends"));
      tl.set("#beats-dark", { opacity: 0 }, at("us"));
      tl.set("#beats-clock-label", { color: "#c9b9c2" }, at("friends"));
      tl.set("#beats-clock-label", { color: "#6a5e64" }, at("us"));


      window.__timelines["beats"] = tl;
    })();
  </script>
</template>
