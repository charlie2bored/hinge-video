<template id="endcard-template">
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
    }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: #f3eee7;
      font-family: "Instrument Serif", serif;
    }
    #endcard-bg {
      position: absolute;
      inset: 0;
      background: #1d1519;
    }
    #endcard-glow {
      position: absolute;
      left: 310px;
      top: -110px;
      width: 1300px;
      height: 1300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231, 195, 214, 0.1) 0%, rgba(231, 195, 214, 0) 60%);
    }
    #endcard-lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 64px;
    }
    #endcard-line {
      display: flex;
      gap: 0.24em;
      font-size: 156px;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    #endcard-line span {
      display: inline-block;
    }
    #endcard-line em {
      display: inline-block;
      font-style: italic;
      color: #e7c3d6;
    }
    #endcard-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }
    #endcard-rule {
      width: 120px;
      height: 1.5px;
      background: rgba(243, 238, 231, 0.45);
      transform-origin: 50% 50%;
    }
    #endcard-wordmark {
      font-size: 76px;
      line-height: 1;
      letter-spacing: -0.01em;
    }
  </style>

  <div
    id="root"
    data-composition-id="endcard"
    data-start="0"
    data-duration="3.5"
    data-width="1920"
    data-height="1080"
  >
    <div id="endcard-bg" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
      <div id="endcard-glow"></div>
    </div>

    <div id="endcard-scene" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
      <div id="endcard-lockup">
        <div id="endcard-line">
          <span>Designed</span><span>to</span><span>be</span><em>deleted.</em>
        </div>
        <div id="endcard-mark">
          <div id="endcard-rule"></div>
          <div id="endcard-wordmark">Hinge</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#endcard-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.05, opacity: 1, duration: 3.5, ease: "sine.out" }, 0);

      // The line rises word by word; "deleted." lands last and a touch slower.
      tl.fromTo(
        "#endcard-line span",
        { opacity: 0, y: 50, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.12 },
        0.15,
      );
      tl.fromTo(
        "#endcard-line em",
        { opacity: 0, y: 50, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        0.6,
      );

      // Wordmark signs it.
      tl.fromTo("#endcard-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.3);
      tl.fromTo("#endcard-wordmark", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.5);

      window.__timelines["endcard"] = tl;
    })();
  </script>
</template>
