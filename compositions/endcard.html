<template id="endcard-template">
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: italic;
      font-weight: 400;
      src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
    }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: #f3eee7;
      font-family: "Instrument Serif", serif;
    }
    #endcard-bg {
      position: absolute;
      inset: 0;
      background: #1d1519;
    }
    /* Ditther-style glow: a Bayer-dithered radial falloff, drawn once, hard pixels */
    #endcard-glow {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      image-rendering: pixelated;
    }
    #endcard-lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 64px;
    }
    #endcard-line {
      display: flex;
      gap: 0.24em;
      font-size: 156px;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    #endcard-line span {
      display: inline-block;
    }
    #endcard-line em {
      display: inline-block;
      font-style: italic;
      color: #e7c3d6;
    }
    #endcard-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }
    #endcard-rule {
      width: 120px;
      height: 1.5px;
      background: rgba(243, 238, 231, 0.45);
      transform-origin: 50% 50%;
    }
    /* MetalForge-style liquid metal: chrome ramp clipped to the type, band travels once */
    #endcard-wordmark {
      padding: 0 0.06em 0.08em;
      font-size: 84px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: transparent;
      background-image: linear-gradient(
        100deg,
        #a39a9f 0%,
        #f3eee7 18%,
        #8f868b 32%,
        #ffffff 46%,
        #7f767b 60%,
        #e9e3e6 78%,
        #9a9196 100%
      );
      background-size: 260% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
    }
  </style>

  <div
    id="root"
    data-composition-id="endcard"
    data-start="0"
    data-duration="4"
    data-width="1920"
    data-height="1080"
  >
    <div id="endcard-bg" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <canvas id="endcard-glow" width="320" height="180" aria-hidden="true"></canvas>
    </div>

    <div id="endcard-scene" class="clip" data-start="0" data-duration="4" data-track-index="1">
      <div id="endcard-lockup">
        <div id="endcard-line">
          <span data-at="designed">Designed</span><span data-at="to">to</span><span data-at="be">be</span><em data-at="deleted">deleted.</em>
        </div>
        <div id="endcard-mark">
          <div id="endcard-rule"></div>
          <div id="endcard-wordmark">Hinge</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const C = window.CUES.endcard;
      const T0 = window.CUES.scenes.endcard.start;
      const at = (name, offset = 0) => C[name] - T0 + offset;
      const SCENE = window.CUES.scenes.endcard.end - T0;

      // Ditther-style texture, painted once (a pure function of the Bayer table):
      // a calm radial field, thinned in the bands behind the line and the wordmark.
      const glow = document.getElementById("endcard-glow");
      const g = glow.getContext("2d");
      const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const band = (y, c, w) => Math.exp(-(((y - c) / w) ** 2));
      g.fillStyle = "rgba(231, 195, 214, 0.16)";
      for (let y = 0; y < 180; y++) {
        const thin = Math.max(0.15, 1 - 0.85 * band(y, 75, 10) - 0.85 * band(y, 110, 6));
        for (let x = 0; x < 320; x++) {
          const d = Math.hypot((x - 160) / 150, (y - 84) / 100);
          const level = Math.max(0, 1 - d) ** 1.6 * thin;
          if (level > (B4[(y & 3) * 4 + (x & 3)] + 0.5) / 16) g.fillRect(x, y, 1, 1);
        }
      }
      tl.fromTo("#endcard-glow", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.04, duration: SCENE, ease: "sine.out" }, 0);

      // The tagline lands word by word on the beat (16px blur, 36px rise, 0.3s).
      document.querySelectorAll("#endcard-line [data-at]").forEach((w) => {
        tl.fromTo(
          w,
          { opacity: 0, y: 36, filter: "blur(16px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out" },
          at(w.dataset.at),
        );
      });

      // Wordmark signs it; the metal's band travels once.
      tl.fromTo("#endcard-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, at("rule"));
      tl.fromTo("#endcard-wordmark", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, at("mark"));
      tl.to("#endcard-wordmark", { backgroundPosition: "0% 0", duration: 1.6, ease: "power2.inOut" }, at("sheen"));

      window.__timelines["endcard"] = tl;
    })();
  </script>
</template>
