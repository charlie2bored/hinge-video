        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${markup}</svg>`;
      const apps = [...GRID_ICONS.slice(0, HINGE), null, ...GRID_ICONS.slice(HINGE)];
      const screen = document.getElementById("delete-screen");
      const grid = document.getElementById("delete-grid");
      const dock = document.getElementById("delete-dock");

      const makeIcon = (parent, left, top, markup, id, dockItem) => {
        const icon = document.createElement("div");
        icon.className = dockItem ? "delete-icon dock" : "delete-icon";
        if (id) icon.id = id;
        icon.style.left = left + "px";
        icon.style.top = top + "px";
        const tile = document.createElement("div");
        tile.className = "delete-tile";
        if (id === "delete-hinge") {
          tile.innerHTML = '<div id="delete-hinge-sheen"></div><span id="delete-hinge-h" data-layout-allow-occlusion>H</span>';
        } else {
          tile.innerHTML = glyph(markup);
        }
        const badge = document.createElement("div");
        badge.className = "delete-badge";
        icon.append(tile, badge);
        parent.appendChild(icon);
        return icon;
      };

      const icons = apps.map((markup, i) => {
        const p = pos(i);
        return makeIcon(grid, p.x, p.y, markup, i === HINGE ? "delete-hinge" : null);
      });
      const dockIcons = DOCK_ICONS.map((markup, i) => makeIcon(dock, 15 + i * 70, 10, markup, null, true));
      const everyIcon = [...icons, ...dockIcons];
      const hinge = icons[HINGE];

      // ---- Copy and phone arrive ---------------------------------------------
      tl.fromTo("#delete-glow", { scale: 0.95 }, { scale: 1.05, duration: 2.75, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#delete-chapter", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#delete-stage", { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#delete-phone", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.05);

      // Specular band crosses the metal tile twice.
      tl.fromTo("#delete-hinge-sheen", { x: 0, rotation: 20 }, { x: 150, rotation: 20, duration: 0.7, ease: "power2.inOut" }, 0.5);
      tl.fromTo("#delete-hinge-sheen", { x: 0 }, { x: 150, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 1.35);
      tl.fromTo("#delete-day", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo(
        "#delete-headline span",
        { opacity: 0, y: 50 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.14 },
        0.25,
      );
      // Sub line streams like Beautiful UI's StreamingText: one word every 55ms,
      // no per-word fade, a solid caret riding the last word, gone when done.
      const sub = document.getElementById("delete-sub");
      const words = sub.textContent.trim().split(" ");
      sub.innerHTML = words
        .map((w) => `<span class="delete-word" data-layout-allow-occlusion>${w}<span class="delete-caret"><i></i></span> </span>`)
        .join("");
      const STREAM = 1.0, STEP = 0.055;
      const wordEls = sub.querySelectorAll(".delete-word");
      const carets = sub.querySelectorAll(".delete-caret i");
      tl.set(wordEls, { opacity: 0 }, 0);
      wordEls.forEach((w, i) => {
        const t = STREAM + i * STEP;
        tl.set(w, { opacity: 1 }, t);
        if (i === 0) tl.fromTo(carets[0], { opacity: 0 }, { opacity: 1, duration: STEP * 0.9, ease: "power1.out" }, t);
        else tl.set(carets[i], { opacity: 1 }, t);
        tl.set(carets[i], { opacity: 0 }, i < words.length - 1 ? t + STEP : t + 0.45);
      });

      // ---- Long-press: icons start to jiggle ----------------------------------
      tl.fromTo("#delete-touch", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" }, 1.2);
      tl.to("#delete-touch", { scale: 1.25, duration: 0.4, ease: "sine.out" }, 1.4);
      // Edit mode pops the pressed icon with Watermelon's dock click spring
      // (k550 c15 m1.1, target scale 1.3 held 200ms), solved analytically.
      const spring = (k, c, m) => {
        const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), wd = w0 * Math.sqrt(1 - z * z);
        return (t) => (t <= 0 ? 0 : 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)));
      };
      const S = spring(550, 15, 1.1);
      const pop = { t: 0 };
      tl.fromTo(
        pop,
        { t: 0 },
        {
          t: 0.9,
          duration: 0.9,
          ease: "none",
          onUpdate: () => gsap.set(hinge, { scale: 1 + 0.3 * (S(pop.t) - S(pop.t - 0.2)) }),
          immediateRender: false,
        },
        1.8,
      );
      tl.fromTo(
        everyIcon,
        { rotation: -2.4 },
        { rotation: 2.4, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 15, stagger: 0.013, immediateRender: false },
        1.8,
      );
      tl.fromTo(
        everyIcon.map((el) => el.querySelector(".delete-badge")),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.008 },
        1.82,
      );

      // Callout: "Press & hold" with a focus ring on the icon.
      tl.fromTo("#delete-focus", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.2);
      tl.to("#delete-focus", { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.95);
      tl.fromTo("#delete-callout-hold", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.25);
      tl.fromTo("#delete-callout-hold .delete-callout-line", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 1.3);
      tl.to("#delete-callout-hold", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.15);

      // ---- Tap the badge, confirm --------------------------------------------
      const hp = pos(HINGE);
      tl.to("#delete-touch", { x: -34, y: -34, scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.95);
      tl.to("#delete-touch", { scale: 0.8, duration: 0.08, ease: "power2.in" }, 2.3);
      tl.to("#delete-touch", { scale: 1, duration: 0.15, ease: "power2.out" }, 2.38);
      tl.to("#delete-phone", { scale: 1.5, duration: 0.5, ease: "power3.inOut" }, 2.3);
      tl.to("#delete-phone", { scale: 1, duration: 0.45, ease: "power3.inOut" }, 3.5);
      tl.fromTo("#delete-dim", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.42);
      // ApprovalCard enters: fade-up 8px, 380ms, ease-out-strong.
      tl.fromTo("#delete-approval", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.38, ease: "power4.out" }, 2.45);

      // Pick "We met on Hinge": glide highlight, radio fills, label inks, Delete wakes up.
      // Touch targets in screen coords (touch starts centred on the icon at 168, 240).
      const TOUCH0 = { x: hp.x + 38, y: hp.y + 38 };
      const OPTION = { x: 100.8, y: 368 }, CONFIRM = { x: 330.8, y: 498 };
      tl.to("#delete-touch", { x: OPTION.x - TOUCH0.x, y: OPTION.y - TOUCH0.y, duration: 0.3, ease: "power2.inOut" }, 2.6);
      tl.to("#delete-touch", { scale: 0.8, duration: 0.08, ease: "power2.in" }, 2.92);
      tl.to("#delete-touch", { scale: 1, duration: 0.12, ease: "power2.out" }, 3.0);
      tl.fromTo("#delete-approval-glide", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.8);
      tl.fromTo("#delete-opt-met .delete-radio-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.inOut" }, 2.95);
      tl.fromTo("#delete-opt-met .delete-radio-dot", { scale: 0 }, { scale: 1, duration: 0.2, ease: "power2.inOut" }, 2.95);
      tl.to("#delete-opt-met", { color: "#1f2124", duration: 0.2, ease: "power2.inOut" }, 2.95);
      tl.to("#delete-confirm", { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.95);

      // Tap Delete.
      tl.to("#delete-touch", { x: CONFIRM.x - TOUCH0.x, y: CONFIRM.y - TOUCH0.y, duration: 0.24, ease: "power2.inOut" }, 3.03);
      tl.fromTo("#delete-callout-tap", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 3.0);
      tl.fromTo("#delete-callout-tap .delete-callout-line", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 3.03);
      tl.to("#delete-callout-tap", { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.38);
      tl.to("#delete-touch", { scale: 0.8, duration: 0.08, ease: "power2.in" }, 3.28);
      tl.to("#delete-confirm", { scale: 0.96, duration: 0.08, ease: "power2.out" }, 3.28);
      tl.to("#delete-confirm", { scale: 1, duration: 0.15, ease: "power2.out" }, 3.36);
      tl.to("#delete-touch", { scale: 1.3, opacity: 0, duration: 0.25, ease: "power2.out" }, 3.38);

      // Resolved: the card unmounts instantly and the green pill pops in (260ms).
      tl.set("#delete-approval", { opacity: 0 }, 3.4);
      tl.fromTo("#delete-resolved", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power4.out" }, 3.4);
      tl.to("#delete-dim", { opacity: 0, duration: 0.25, ease: "power2.out" }, 3.5);
      tl.to("#delete-resolved", { opacity: 0, y: -8, duration: 0.25, ease: "power2.in" }, 4.3);

      // ---- The app goes -------------------------------------------------------
      tl.to(hinge, { scale: 0, rotation: 18, duration: 0.32, ease: "back.in(2)" }, 3.68);
      document.querySelectorAll(".delete-puff").forEach((puff, i) => {
        const a = (i / 6) * Math.PI * 2 + 0.4;
        tl.fromTo(
          puff,
          { x: 0, y: 0, scale: 1, opacity: 0.9 },
          { x: Math.cos(a) * 70, y: Math.sin(a) * 70, scale: 0.2, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false },
          3.95,
        );
      });
      tl.to(everyIcon, { rotation: 0, duration: 0.12, ease: "power2.out" }, 3.9);
      icons.slice(HINGE + 1).forEach((icon, k) => {
        const i = HINGE + 1 + k;
        const from = pos(i), to = pos(i - 1);
        tl.to(icon, { x: to.x - from.x, y: to.y - from.y, duration: 0.45, ease: "power3.inOut" }, 4.0 + k * 0.025);
      });

      // ---- Dithered iris out of the empty slot into the end card -------------
      // Stateless per frame: each 8px cell compares (progress − distance) to an
      // 8×8 Bayer threshold, so any seek repaints the same pixels.
      const iris = document.getElementById("delete-iris");
      const ictx = iris.getContext("2d");
      const W = 240, H = 135, CX = 1284.2 / 8, CY = 333.3 / 8; // Hinge icon centre, global
      const MAXD = Math.hypot(CX, H - CY);
      const bayer = (() => {
        let m = [[0]];
        while (m.length < 8) {
          const n = m.length, next = [];
          for (let y = 0; y < n * 2; y++) {
            next.push([]);
            for (let x = 0; x < n * 2; x++) {
              const q = [0, 2, 3, 1][(y >= n) * 2 + (x >= n)];
              next[y].push(4 * m[y % n][x % n] + q);
            }
          }
          m = next;
        }
        return m.map((row) => row.map((v) => (v + 0.5) / 64));
      })();
      const img = ictx.createImageData(W, H);
      const INK = [29, 21, 25], PLUM = [109, 46, 98];
      const paintIris = (p) => {
        const d = img.data;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const dist = Math.hypot(x - CX, y - CY) / MAXD;
            const v = (p * 1.8 - dist) / 0.4; // <0 outside; ≥2 everywhere once p = 1
            const t = bayer[y & 7][x & 7];
            const c = v >= t + 1 ? INK : v >= t ? PLUM : null;
            if (c) {
              d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
            } else {
              d[i + 3] = 0;
            }
          }
        }
        ictx.putImageData(img, 0, 0);
      };
      const irisState = { p: 0 };
      tl.fromTo(
        irisState,
        { p: 0 },
        { p: 1, duration: 0.85, ease: "power2.in", onUpdate: () => paintIris(irisState.p), immediateRender: false },
        4.55,
      );

      window.__timelines["delete"] = tl;
    })();
  </script>
</template>
