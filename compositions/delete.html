  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // ---- Home screen, laid out once from fixed constants -------------------
      const ICON = 76, COL = 92, ROW = 108, X0 = 25, Y0 = 84, HINGE = 5;
      const pos = (i) => ({ x: X0 + (i % 4) * COL, y: Y0 + Math.floor(i / 4) * ROW });
      // Hugeicons (MIT), the icon library Watermelon's dock uses: assets/icons.js.
      const GRID_ICONS = window.HUGEICONS.grid;
      const DOCK_ICONS = window.HUGEICONS.dock;
      const glyph = (markup) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${markup}</svg>`;
      const apps = [...GRID_ICONS.slice(0, HINGE), null, ...GRID_ICONS.slice(HINGE)];
      const screen = document.getElementById("delete-screen");
      const grid = document.getElementById("delete-grid");
      const dock = document.getElementById("delete-dock");

      const makeIcon = (parent, left, top, markup, id, dockItem) => {
        const icon = document.createElement("div");
        icon.className = dockItem ? "delete-icon dock" : "delete-icon";
        if (id) icon.id = id;
        icon.style.left = left + "px";
        icon.style.top = top + "px";
        const tile = document.createElement("div");
        tile.className = "delete-tile";
        if (id === "delete-hinge") {
          tile.innerHTML = '<div id="delete-hinge-sheen"></div><span id="delete-hinge-h" data-layout-allow-occlusion>H</span>';
        } else {
          tile.innerHTML = glyph(markup);
        }
        const badge = document.createElement("div");
        badge.className = "delete-badge";
        icon.append(tile, badge);
        parent.appendChild(icon);
        return icon;
      };

      const icons = apps.map((markup, i) => {
        const p = pos(i);
        return makeIcon(grid, p.x, p.y, markup, i === HINGE ? "delete-hinge" : null);
      });
      const dockIcons = DOCK_ICONS.map((markup, i) => makeIcon(dock, 15 + i * 70, 10, markup, null, true));
      const everyIcon = [...icons, ...dockIcons];
      const hinge = icons[HINGE];

      // ---- Timing: cue names from cues.js, local to this scene ----------------
      const C = window.CUES.delete;
      const T0 = window.CUES.scenes.delete.start;
      const at = (name, offset = 0) => C[name] - T0 + offset;
      const cue = (spec) => {
        const [name, offset] = spec.split(":");
        return at(name, Number(offset || 0));
      };
      // Closed-form spring (product-film kit/spring.ts), k150 c20, as a GSAP ease.
      const step = (t, k = 150, c = 20) => {
        if (t <= 0) return 0;
        const w = Math.sqrt(k), z = c / (2 * w), wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
      };
      const glide = (duration) => (p) => step(p * duration);

      // ---- Bar 8: the phone arrives on its stage -------------------------------
      tl.fromTo("#delete-stage", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.8, ease: glide(0.8) }, at("phoneIn"));
      tl.fromTo("#delete-phone", { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.8, ease: glide(0.8) }, at("phoneIn", 0.05));
      // The metal's specular band crosses the Hinge icon.
      tl.fromTo("#delete-hinge-sheen", { x: 0, rotation: 20 }, { x: 150, rotation: 20, duration: 0.7, ease: "power2.inOut" }, at("sheen"));

      // Press & hold (touch lands on the beat, focus ring + callout).
      tl.fromTo("#delete-touch", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, at("press", -0.2));
      tl.to("#delete-touch", { scale: 0.86, duration: 0.1, ease: "power2.in" }, at("press"));
      tl.fromTo("#delete-focus", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.4, ease: glide(0.4) }, at("press"));
      tl.fromTo("#delete-callout-hold", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at("press"));
      tl.fromTo("#delete-callout-hold .delete-callout-line", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, at("press", 0.05));
      tl.to(["#delete-focus", "#delete-callout-hold"], { opacity: 0, duration: 0.2, ease: "power2.out" }, at("badgeTap", -0.4));

      // Edit mode: every icon jiggles, badges appear, and the pressed icon pops with
      // Watermelon's dock click spring (k550 c15 m1.1, target scale 1.3 held 200ms).
      const spring = (k, c, m) => {
        const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), wd = w0 * Math.sqrt(1 - z * z);
        return (t) => (t <= 0 ? 0 : 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)));
      };
      const S = spring(550, 15, 1.1);
      const pop = { t: 0 };
      tl.fromTo(
        pop,
        { t: 0 },
        {
          t: 0.9,
          duration: 0.9,
          ease: "none",
          onUpdate: () => gsap.set(hinge, { scale: 1 + 0.3 * (S(pop.t) - S(pop.t - 0.2)) }),
          immediateRender: false,
        },
        at("editMode"),
      );
      tl.to("#delete-touch", { opacity: 0, scale: 1, duration: 0.18, ease: "power2.out" }, at("editMode"));
      const JIG = 0.11;
      const jiggleSpan = at("vanish") - at("editMode");
      tl.fromTo(
        everyIcon,
        { rotation: -2.4 },
        { rotation: 2.4, duration: JIG, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(jiggleSpan / JIG) - 2), stagger: 0.013, immediateRender: false },
        at("editMode"),
      );
      tl.fromTo(
        everyIcon.map((el) => el.querySelector(".delete-badge")),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: glide(0.3), stagger: 0.008 },
        at("editMode", 0.02),
      );

      // ---- Bar 9: tap the badge, answer the exit question ----------------------
      const hp = pos(HINGE);
      const TOUCH0 = { x: hp.x + 38, y: hp.y + 38 }; // the touch starts centred on the icon
      // Touch targets in screen coords: the badge, the radio (not its label), the
      // right end of the Delete pill (not its word).
      const BADGE = { x: hp.x + 5, y: hp.y + 5 };
      const OPTION = { x: 50.8, y: 368 }, CONFIRM = { x: 368, y: 498 };
      const touchTo = (p, t, d = 0.3) =>
        tl.to("#delete-touch", { x: p.x - TOUCH0.x, y: p.y - TOUCH0.y, duration: d, ease: "power2.inOut" }, t);
      tl.set("#delete-touch", { x: BADGE.x - TOUCH0.x, y: BADGE.y - TOUCH0.y }, at("badgeTap", -0.3));
      tl.to("#delete-touch", { opacity: 1, duration: 0.15, ease: "power2.out" }, at("badgeTap", -0.3));
      tl.to("#delete-touch", { scale: 0.86, duration: 0.08, ease: "power2.in" }, at("badgeTap", -0.08));
      tl.to("#delete-touch", { scale: 1, duration: 0.12, ease: "power2.out" }, at("badgeTap"));
      // Zoom to the card (Tokokino-style region zoom), pivoting on the card itself.
      tl.to("#delete-phone", { scale: 1.5, duration: 0.5, ease: "power3.inOut" }, at("badgeTap"));
      tl.fromTo("#delete-dim", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at("badgeTap", 0.1));
      // ApprovalCard enters: fade-up 8px, 380ms, ease-out-strong.
      tl.fromTo("#delete-approval", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.38, ease: "power4.out" }, at("cardIn"));

      // Pick "We met on Hinge": glide highlight, radio fills, label inks, Delete wakes up.
      touchTo(OPTION, at("pick", -0.3), 0.26);
      tl.fromTo("#delete-approval-glide", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, at("pick", -0.15));
      tl.to("#delete-touch", { scale: 0.86, duration: 0.08, ease: "power2.in" }, at("pick", -0.08));
      tl.to("#delete-touch", { scale: 1, duration: 0.12, ease: "power2.out" }, at("pick"));
      tl.fromTo("#delete-opt-met .delete-radio-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.inOut" }, at("pick"));
      tl.fromTo("#delete-opt-met .delete-radio-dot", { scale: 0 }, { scale: 1, duration: 0.2, ease: "power2.inOut" }, at("pick"));
      tl.to("#delete-opt-met", { color: "#1f2124", duration: 0.2, ease: "power2.inOut" }, at("pick"));
      tl.to("#delete-confirm", { opacity: 1, duration: 0.15, ease: "power2.out" }, at("pick"));

      // Over to Delete, with the callout.
      touchTo(CONFIRM, at("toDelete", -0.25), 0.25);
      tl.fromTo("#delete-callout-tap", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, at("toDelete"));
      tl.fromTo("#delete-callout-tap .delete-callout-line", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, at("toDelete", 0.03));
      tl.to("#delete-callout-tap", { opacity: 0, duration: 0.2, ease: "power2.out" }, at("deleteTap", -0.1));

      // ---- Bar 10: Delete, the app goes, the iris ------------------------------
      tl.to(["#delete-touch", "#delete-confirm"], { scale: 0.96, duration: 0.08, ease: "power2.out" }, at("deleteTap", -0.08));
      tl.to("#delete-confirm", { scale: 1, duration: 0.15, ease: "power2.out" }, at("deleteTap"));
      tl.to("#delete-touch", { opacity: 0, duration: 0.2, ease: "power2.out" }, at("deleteTap", 0.02));
      // Resolved: the card unmounts instantly and the green pill pops in (260ms).
      tl.set("#delete-approval", { opacity: 0 }, at("deleteTap", 0.05));
      tl.fromTo("#delete-resolved", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power4.out" }, at("deleteTap", 0.05));
      tl.to("#delete-dim", { opacity: 0, duration: 0.25, ease: "power2.out" }, at("deleteTap", 0.15));
      tl.to("#delete-phone", { scale: 1, duration: 0.45, ease: "power3.inOut" }, at("deleteTap", 0.1));

      tl.to(hinge, { scale: 0, duration: 0.3, ease: "power2.in" }, at("vanish", -0.15));
      tl.to(everyIcon, { rotation: 0, duration: 0.12, ease: "power2.out" }, at("vanish"));
      icons.slice(HINGE + 1).forEach((icon, k) => {
        const i = HINGE + 1 + k;
        const from = pos(i), to = pos(i - 1);
        tl.to(icon, { x: to.x - from.x, y: to.y - from.y, duration: 0.6, ease: glide(0.6) }, at("reflow", -0.1 + k * 0.025));
      });
      tl.to("#delete-resolved", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "none" }, at("iris", -0.1));

      // ---- Dithered iris out of the empty slot into the end card -------------
      // Stateless per frame: each 8px cell compares (progress − distance) to an
      // 8×8 Bayer threshold, so any seek repaints the same pixels.
      const iris = document.getElementById("delete-iris");
      const ictx = iris.getContext("2d");
      const W = 240, H = 135, CX = 914.2 / 8, CY = 333.3 / 8; // Hinge icon centre, global
      const MAXD = Math.max(Math.hypot(CX, CY), Math.hypot(W - CX, CY), Math.hypot(CX, H - CY), Math.hypot(W - CX, H - CY));
      const bayer = (() => {
        let m = [[0]];
        while (m.length < 8) {
          const n = m.length, next = [];
          for (let y = 0; y < n * 2; y++) {
            next.push([]);
            for (let x = 0; x < n * 2; x++) {
              const q = [0, 2, 3, 1][(y >= n) * 2 + (x >= n)];
              next[y].push(4 * m[y % n][x % n] + q);
            }
          }
          m = next;
        }
        return m.map((row) => row.map((v) => (v + 0.5) / 64));
      })();
      const img = ictx.createImageData(W, H);
      const INK = [29, 21, 25], PLUM = [109, 46, 98];
      const paintIris = (p) => {
        const d = img.data;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const dist = Math.hypot(x - CX, y - CY) / MAXD;
            const v = (p * 1.8 - dist) / 0.4; // <0 outside; ≥2 everywhere once p = 1
            const t = bayer[y & 7][x & 7];
            const c = v >= t + 1 ? INK : v >= t ? PLUM : null;
            if (c) {
              d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
            } else {
              d[i + 3] = 0;
            }
          }
        }
        ictx.putImageData(img, 0, 0);
      };
      const irisState = { p: 0 };
      tl.fromTo(
        irisState,
        { p: 0 },
        { p: 1, duration: 0.75, ease: "power2.in", onUpdate: () => paintIris(irisState.p), immediateRender: false },
        at("iris"),
      );

      window.__timelines["delete"] = tl;
    })();
  </script>
</template>
