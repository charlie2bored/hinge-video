<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hinge — Designed to be deleted</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="cues.js"></script>
    <script src="assets/icons.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3eee7;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3eee7;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene slots sit on bars (120 BPM, a bar is 2s); cues.js is the source of truth
           and scripts/beatsheet.mjs fails if these drift from it. -->
      <!-- 01 · a prompt gets a like (bars 1–3) -->
      <div
        id="el-prompt"
        data-composition-id="prompt"
        data-composition-src="compositions/prompt.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 02 · the relationship, word by word (bars 4–6) -->
      <div
        id="el-beats"
        data-composition-id="beats"
        data-composition-src="compositions/beats.html"
        data-start="6"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 03 · found your person? (bar 7) -->
      <div
        id="el-found"
        data-composition-id="found"
        data-composition-src="compositions/found.html"
        data-start="12"
        data-duration="2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 04 · delete the app (bars 8–10) -->
      <div
        id="el-delete"
        data-composition-id="delete"
        data-composition-src="compositions/delete.html"
        data-start="14"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 05 · end card (bars 11–12) -->
      <div
        id="el-endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="20"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Score + UI sound, synthesized by scripts/make_score.py -->
      <audio
        id="score"
        src="assets/audio/score.mp3"
        data-start="0"
        data-duration="24"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- magic move across the cut: prompt.handoff → beats.likeMark -->
      <div
        id="el-traveler"
        data-composition-id="traveler"
        data-composition-src="compositions/traveler.html"
        data-start="5.75"
        data-duration="0.75"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
